<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
      width: 330px;
      padding: 14px;
      margin: 0;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    
    .header-card {
      background: #0f172a;
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.25);
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }
    .header-ticker {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .corp-card {
      background: #ffffff;
      border-radius: 8px;
      padding: 11px 13px;
      margin-bottom: 9px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04);
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 500;
      color: #1e293b;
    }
    .row:last-child {
      margin-bottom: 0;
    }

    input[type="number"], select {
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11.5px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="number"]:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    select {
      max-width: 155px;
    }

    /* Corporate Precision Toggle Switches */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .25s ease;
      border-radius: 18px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px; width: 12px;
      left: 3px; bottom: 3px;
      background-color: #ffffff;
      transition: .25s ease;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    input:checked + .slider { background-color: #0f172a; }
    input:checked + .slider:before {
      transform: translateX(14px);
    }

    /* Corporate Action Buttons */
    .btn-primary {
      width: 100%;
      padding: 9px 12px;
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #0f172a;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.15s, border-color 0.15s;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.1);
    }
    .btn-primary:hover { background: #1e293b; border-color: #1e293b; }
    .btn-primary:active { transform: translateY(1px); }

    .btn-secondary {
      width: 100%;
      padding: 8px 12px;
      background: #ffffff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 11.5px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover { background: #eff6ff; border-color: #93c5fd; }

    .btn-outline {
      width: 100%;
      padding: 7px 12px;
      background: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 11px;
      transition: background 0.15s;
    }
    .btn-outline:hover { background: #f1f5f9; color: #1e293b; }

    #status {
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 class="header-title">✈️ FLIGHT HACKER <span style="font-size:9.5px; background:#1e293b; color:#93c5fd; padding:2px 6px; border-radius:4px; font-weight:600; border:1px solid #334155; margin-left:4px; letter-spacing:0.04em;">ENTERPRISE v2.0</span></h3>
      <span id="fxStatusPill" style="font-size:10px; background:#064e3b; color:#34d399; padding:2px 8px; border-radius:12px; font-weight:600; border:1px solid #047857;">🟢 Live FX</span>
    </div>
    <div id="liveFxTicker" class="header-ticker">USD 1.00 = INR 83.50</div>
    <button id="openGoogleFlightsTopBtn" type="button" style="width:100%; margin-top:9px; padding:6px 10px; background:#1e293b; border:1px solid #334155; color:#f8fafc; border-radius:6px; font-weight:600; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:background 0.15s;" title="Open Google Flights in a new tab">✈️ Open Google Flights</button>
  </div>
  
  <div class="corp-card" style="background:#eff6ff; border-color:#bfdbfe;">
    <div class="row" style="margin-bottom:0;">
      <label style="font-weight:700; color:#1e40af; font-size:12.5px;" title="Enable or Disable Flight Hacker Pro features on Google Flights">Extension Active</label>
      <label class="toggle-switch">
        <input type="checkbox" id="extensionEnabled" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <div class="corp-card">
    <div class="section-title">Currency & Valuation</div>
    <div class="row">
      <label title="Your home currency for flight price conversions">Base Currency</label>
      <select id="baseCurrency">
        <option value="INR">INR (₹)</option>
        <option value="USD">USD ($)</option>
        <option value="EUR">EUR (€)</option>
        <option value="GBP">GBP (£)</option>
        <option value="AED">AED (AED)</option>
        <option value="AUD">AUD (A$)</option>
        <option value="CAD">CAD (C$)</option>
        <option value="SGD">SGD (S$)</option>
      </select>
    </div>
    <div class="row">
      <label id="timeValueLabel" title="Used to calculate Cost vs Time tradeoffs">Value of Time (per hr)</label>
      <input type="number" id="timeValue" value="50" min="0">
    </div>
  </div>

  <div class="corp-card">
    <div class="section-title">Baggage & Payment Cards</div>
    <div class="row">
      <label title="Specify required checked bags per passenger. Net baggage fees will be calculated based on fare class inclusions.">Checked Bags</label>
      <input type="number" id="checkedBags" value="0" min="0" max="5">
    </div>
    <div class="row">
      <label title="Number of passengers in your booking. Multiplies baggage & seat fees, and evaluates group booking fare bucket jump traps.">Passengers (Family Tax)</label>
      <input type="number" id="passengerCount" value="1" min="1" max="9">
    </div>
    <div class="row">
      <label title="Select your payment card to factor in foreign exchange markup fees (0% to 3.5%) and card rewards cashbacks (1% to 6%).">Payment Card</label>
      <select id="rewardCard">
        <option value="none">Standard Card (3.5% FX, 0% Rew)</option>
        <option value="chase_csr">Chase Sapphire Reserve (0% FX, 4.5% Rew)</option>
        <option value="amex_plat">Amex Platinum (0% FX, 7.5% Rew)</option>
        <option value="capone_vx">Capital One Venture X (0% FX, 3.0% Rew)</option>
        <option value="citi_premier">Citi Premier / Strata (0% FX, 3.0% Rew)</option>
        <option value="revolut">Revolut / Wise Multi-Curr (0% FX)</option>
        <option value="scapia" selected>FedBank Scapia (0% FX, 2.0% Rew)</option>
        <option value="magnus">Axis Magnus (2.0% FX, 6.0% Rew)</option>
        <option value="infinia">HDFC Infinia (2.0% FX, 3.3% Rew)</option>
        <option value="octane">SBI Octane (3.5% FX, 1.0% Rew)</option>
        <option value="zero_fx">Generic 0% Forex Card</option>
      </select>
    </div>
  </div>

  <div class="corp-card">
    <div class="section-title">Points & Passport Profile</div>
    <div class="row">
      <label title="Select primary loyalty program to display Cent-Per-Point (CPP) award redemption valuations on cash flight cards.">Loyalty Program</label>
      <select id="loyaltyProgram">
        <option value="aeroplan">Air Canada Aeroplan</option>
        <option value="avios">BA / Qatar Avios</option>
        <option value="krisflyer">Singapore KrisFlyer</option>
        <option value="flyingblue">Air France Flying Blue</option>
        <option value="skymiles">Delta SkyMiles</option>
        <option value="mileageplus">United MileagePlus</option>
        <option value="scapia">FedBank Scapia Pts</option>
        <option value="magnus">Axis Edge Miles</option>
        <option value="infinia">HDFC Reward Pts</option>
      </select>
    </div>
    <div class="row">
      <label title="Select passport country to check international transit visa requirements and Schengen multi-airport layover rules.">Passport Nationality</label>
      <select id="passportNationality">
        <option value="India" selected>India (IN)</option>
        <option value="United States">United States (US)</option>
        <option value="United Kingdom">United Kingdom (UK)</option>
        <option value="Germany">Germany / EU (DE)</option>
        <option value="France">France / EU (FR)</option>
        <option value="Australia">Australia (AU)</option>
        <option value="Canada">Canada (CA)</option>
        <option value="Singapore">Singapore (SG)</option>
        <option value="Japan">Japan (JP)</option>
        <option value="United Arab Emirates">United Arab Emirates (AE)</option>
        <option value="China">China (CN)</option>
        <option value="Brazil">Brazil (BR)</option>
      </select>
    </div>
  </div>

  <div class="corp-card">
    <div class="section-title">Filters & Hacks (v2.0)</div>
    <div class="row">
      <label title="Automatically hide self-transfer flights operating on separate un-bundled tickets that require re-clearing customs.">Hide Self-Transfers</label>
      <label class="toggle-switch">
        <input type="checkbox" id="hideSelfTransfers" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label title="Display aircraft cabin pressure, humidity, air quality, and cabin comfort rating badges (e.g. Boeing 787 / Airbus A350).">Show Comfort Analytics</label>
      <label class="toggle-switch">
        <input type="checkbox" id="showComfort" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label title="Detect split-ticket savings on roundtrip searches">Show Split-Ticket Hacks</label>
      <label class="toggle-switch">
        <input type="checkbox" id="showSplitTickets" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label title="Show Cent-Per-Point CPP Valuation & EQM Badges">Show CPP & EQM Badges</label>
      <label class="toggle-switch">
        <input type="checkbox" id="showCPP" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label title="Match airport lounges & transit visa risks">Show Lounge & Visa Assist</label>
      <label class="toggle-switch">
        <input type="checkbox" id="showLoungeVisa" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label title="Detect positioning flight savings via mega-hubs">Show Hub-Hunting Deals</label>
      <label class="toggle-switch">
        <input type="checkbox" id="showHubHunting" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label title="Detect free/subsidized airline stopover programs (e.g. Turkish free hotel in IST, Icelandair free 7-day KEF stopover, Qatar luxury stays in DOH) and optimize multi-city & open-jaw itineraries.">Show Stopover & Multi-City Hacks</label>
      <label class="toggle-switch">
        <input type="checkbox" id="showStopovers" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="corp-card">
    <div class="section-title">Matrix Deep Scan Settings</div>
    <div class="row">
      <label title="Scanning horizon range & lead time sweet spots (14 to 180 days)">Scan Horizon</label>
      <select id="scanHorizon">
        <option value="14">14 Days (Immediate / Last-Minute)</option>
        <option value="30" selected>30 Days (Standard 1-Month)</option>
        <option value="60">60 Days (Domestic Sweet Spot)</option>
        <option value="90">90 Days (Intl Sweet Spot)</option>
        <option value="120">120 Days (Deep Advance Horizon)</option>
        <option value="180">180 Days (6-Month Long-Range)</option>
      </select>
    </div>
    <div class="row">
      <label title="Trip duration range brackets">Trip Length Bracket</label>
      <select id="tripBracket">
        <option value="1-3">1 – 3 Days (Weekend Short Stay)</option>
        <option value="3-7">3 – 7 Days (Short Trip)</option>
        <option value="7-10">7 – 10 Days (1-Week Vacation)</option>
        <option value="7-14">7 – 14 Days (2-Week Holiday)</option>
        <option value="14-21">14 – 21 Days (3-Week Extended)</option>
        <option value="21-30">21 – 30 Days (1-Month Long Stay)</option>
        <option value="14-45">14 – 45 Days (2 to 6 Weeks)</option>
        <option value="21-45">21 – 45 Days (3 to 6 Weeks)</option>
        <option value="30-45">30 – 45 Days (1 to 1.5 Months)</option>
        <option value="5-21" selected>5 – 21 Days (Flexible Standard)</option>
        <option value="1-30">1 – 30 Days (Full Broad Range)</option>
        <option value="1-45">1 – 45 Days (Extended Range 45d)</option>
      </select>
    </div>
  </div>

  <div class="corp-card">
    <div class="section-title">Advanced Fee Overrides (Precision)</div>
    <div class="row">
      <label title="Custom checked baggage fee rate per bag in your selected base currency">Bag Fee (Base Currency)</label>
      <input type="number" id="customBagFee" placeholder="Auto (40 USD / 3000 INR)" min="0" max="50000" step="1" style="width: 100px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px;">
    </div>
    <div class="row">
      <label title="Custom seat selection fee rate per passenger in your selected base currency">Seat Fee (Base Currency)</label>
      <input type="number" id="customSeatFee" placeholder="Auto (15 USD / 1000 INR)" min="0" max="20000" step="1" style="width: 100px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px;">
    </div>
    <div class="row">
      <label title="Custom award ticket taxes & fees co-pay ($ USD)">Award Ticket Tax ($ USD)</label>
      <input type="number" id="customAwardTaxes" placeholder="Auto ($50)" min="0" max="1000" step="5" style="width: 100px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px;">
    </div>
    <div class="row">
      <label title="Custom payment card FX fee percentage (%)">Card FX Fee (%)</label>
      <input type="number" id="customCardFxPct" placeholder="Auto Card" min="0" max="10" step="0.1" style="width: 100px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px;">
    </div>
  </div>

  <button id="launchMatrixScan" class="btn-primary" style="margin-bottom: 7px;">📊 Launch Matrix Deep Scan</button>
  <button id="checkArbitrage" class="btn-secondary" style="margin-bottom: 7px;" title="Check regional Point-of-Sale currency arbitrage deals">🌐 Check Regional POS Deals</button>
  <button id="clearCacheBtn" class="btn-outline" style="margin-bottom: 6px;" title="Purge stored date cache & auto-tune route baseline to live page fare">🧹 Purge Cache & Auto-Tune</button>
  <button id="resetDefaults" class="btn-outline" style="margin-bottom: 4px; border-color:transparent; color:#64748b;">🔄 Reset Defaults</button>
  <p id="status"></p>
  <button id="arbLink" type="button" class="btn-secondary" style="display:none; text-align:center; margin-top:8px; border-color:#059669; color:#059669; background:#ecfdf5;">👉 Open Verified POS Deal</button>

  <script src="popup.js"></script>
</body>
</html>
